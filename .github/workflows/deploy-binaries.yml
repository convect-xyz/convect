name: "Build, Test"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Infra Version"
        required: true
        default: "warning"
        type: choice
        options:
          - infra-dev
          - infra-v1
  # push:
  #   paths:
  #     - "rust/**"
  #     - "packages/**"
  #     - "apps/bundler/**"
  #     - "infra/**"
  #   branches:
  #     - "infra/**"

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  CONFIG__REDIS__URL: ${{ secrets.CONFIG__REDIS__URL }}
  TINYBIRD_API_KEY: ${{ secrets.TINYBIRD_API_KEY }}
  INFRA_VERSION: ${{ github.event.inputs.version || github.event.release.tag_name || github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy_config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3.5.0
        with:
          node-version-file: package.json
      - name: Generate AES-256 Key for SSE-C
        run: |
          # Generate a 32-byte key and base64 encode it
          encryption_key=$(openssl rand -base64 32)
          echo "Generated Encryption Key: $encryption_key"

          # Store the key as an environment variable to use in the next steps
          echo "CONFIG_ENCRYPTION_PRIVATE_KEY=$encryption_key" >> $GITHUB_OUTPUT
          echo "CONFIG_ENCRYPTION_ALGORITHM=AES256" >> $GITHUB_OUTPUT
          echo "CONFIG_ENCRYPTION_PRIVATE_KEY=$encryption_key" >> $GITHUB_ENV
          echo "CONFIG_ENCRYPTION_ALGORITHM=AES256" >> $GITHUB_ENV
      - name: Set up node cache
        uses: actions/cache@v3
        continue-on-error: false
        with:
          path: |
            node_modules
            infra/node_modules
          key: ${{ runner.os }}-deploy-config-${{ hashFiles('infra/yarn.lock') }}-
          restore-keys: ${{ runner.os }}-deploy-config-
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Installing dependencies 📦️
        run: cd infra && yarn
      - name: Deploy config
        run: cd infra && yarn deploy:config

  build_all_and_cache:
    needs: [deploy_config]
    env:
      CONFIG_ENCRYPTION_PRIVATE_KEY: ${{ needs.deploy_config.outputs.config_encryption_private_key }}
      CONFIG_ENCRYPTION_ALGORITHM: ${{ needs.deploy_config.outputs.config_encryption_algorithm }}
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Zig toolchain
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.10.0
      - uses: actions/checkout@master
      - name: Install Cargo Lambda
        uses: jaxxstorm/action-install-gh-release@v1.9.0
        with:
          repo: cargo-lambda/cargo-lambda
          platform: linux
          arch: x86_64
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v3-rust"
          shared-key: shared
          workspaces: "rust"
          cache-all-crates: "true"
          cache-on-failure: "true"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev postgresql
      - name: Run integration tests
        working-directory: rust
        env:
          DATABASE_URL: ${{ secrets.PROD_REPORTING_DB_URL }}
          CONFIG_ENCRYPTION_PRIVATE_KEY: ${{ needs.deploy_config.outputs.config_encryption_private_key }}
          CONFIG_ENCRYPTION_ALGORITHM: ${{ needs.deploy_config.outputs.config_encryption_algorithm }}
        run: |
          cargo nextest run -p shared --features=pg
      - name: Build and Upload All Binaries
        working-directory: rust
        env:
          GITHUB_SHA: ${{ github.sha }}
          CONFIG_ENCRYPTION_PRIVATE_KEY: ${{ needs.deploy_config.outputs.config_encryption_private_key }}
          CONFIG_ENCRYPTION_ALGORITHM: ${{ needs.deploy_config.outputs.config_encryption_algorithm }}
        run: |
          cargo lambda build --output-format zip -p orchestrator -p reporting --release
          cargo lambda build --extension --output-format zip -p extension -p handler-server --release

          aws s3api put-object --bucket ingest-functions --key reporting/$GITHUB_SHA.zip --body "./target/lambda/reporting/bootstrap.zip"
          aws s3api put-object --bucket ingest-functions --key orchestrator/$GITHUB_SHA.zip --body "./target/lambda/orchestrator/bootstrap.zip"
          aws s3api put-object --bucket ingest-functions --key extension/$GITHUB_SHA.zip --body "./target/lambda/extensions/extension.zip"
          aws s3api put-object --bucket ingest-functions --key handler-server/$GITHUB_SHA.zip --body "./target/lambda/extensions/handler-server.zip"

  build_images:
    needs: [deploy_config]
    env:
      CONFIG_ENCRYPTION_PRIVATE_KEY: ${{ needs.deploy_config.outputs.config_encryption_private_key }}
      CONFIG_ENCRYPTION_ALGORITHM: ${{ needs.deploy_config.outputs.config_encryption_algorithm }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        binary: ["builder", "syncer"]
    steps:
      - name: Install soci
        uses: lerentis/soci-installer@v1.1.0
        with:
          install-dir: /usr/local/bin
      - name: Check install!
        run: soci --version
      - name: Set up containerd
        uses: crazy-max/ghaction-setup-containerd@v2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, tag, and push docker image to Amazon ECR
        uses: docker/build-push-action@v5
        with:
          push: false
          tags: "${{ steps.login-ecr.outputs.registry }}/${{ matrix.binary }}:${{ github.sha }}"
          cache-from: type=gha,scope=${{ matrix.binary }}
          cache-to: type=gha,mode=max,scope=${{ matrix.binary }}
          file: ./docker/${{ matrix.binary }}/Dockerfile.${{ matrix.binary }}
          outputs: type=oci,dest=/tmp/image.tar

      - name: Import image in containerd
        env:
          REGISTRY_URL: "${{ steps.login-ecr.outputs.registry }}/${{ matrix.binary }}:${{ github.sha }}"
          BASE_NAME: "${{ steps.login-ecr.outputs.registry }}/${{ matrix.binary }}"
        run: |
          sudo ctr i import --base-name $BASE_NAME --digests --all-platforms /tmp/image.tar

      - name: Push image with containerd
        env:
          REGISTRY_URL: "${{ steps.login-ecr.outputs.registry }}/${{ matrix.binary }}:${{ github.sha }}"
        run: |
          PASSWORD=$(aws ecr get-login-password --region eu-west-1)
          sudo ctr i push --user "AWS:$PASSWORD" $REGISTRY_URL

      - name: Create and push SOCI index
        env:
          REGISTRY_URL: "${{ steps.login-ecr.outputs.registry }}/${{ matrix.binary }}:${{ github.sha }}"
        run: |
          PASSWORD=$(aws ecr get-login-password --region eu-west-1)
          sudo soci create $REGISTRY_URL
          sudo soci push --user AWS:$PASSWORD $REGISTRY_URL

  deploy_pulumi:
    needs: [build_all_and_cache, build_images]
    name: Deploy Pulumi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3.5.0
        with:
          node-version-file: package.json
      - name: Set up node cache
        uses: actions/cache@v3
        continue-on-error: false
        with:
          path: |
            node_modules
            infra/node_modules
          key: ${{ runner.os }}-deploy-pulumi-${{ hashFiles('infra/yarn.lock') }}-
          restore-keys: ${{ runner.os }}-deploy-pulumi-
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Set version
        env:
          VERSION: ${{ github.event.inputs.version || github.event.release.tag_name || github.ref_name }}
        run: |
          VERSION=${VERSION//\//-}
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Installing dependencies 📦️
        run: cd infra && yarn
      - uses: pulumi/actions@v3
        with:
          command: up
          work-dir: ./infra
          stack-name: ${{ env.VERSION }}
          upsert: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          TEST_STRIPE_API_KEY: ${{ secrets.TEST_STRIPE_API_KEY }}
          PROD_STRIPE_API_KEY: ${{ secrets.PROD_STRIPE_API_KEY }}
          TINYBIRD_API_KEY: ${{ secrets.TINYBIRD_API_KEY }}
          PROD_REPORTING_DB_URL: ${{ secrets.PROD_REPORTING_DB_URL }}
