name: Build, Test, Deploy

on:
  release:
    types: [created]

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  build_lambdas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        binary: ["log-fetcher", "orchestrator"]
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Zig toolchain
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.10.0
      - name: Install Cargo Lambda
        uses: jaxxstorm/action-install-gh-release@v1.9.0
        with:
          repo: cargo-lambda/cargo-lambda
          platform: linux
          arch: x86_64
      - uses: actions/checkout@master
      - name: Set up cargo cache
        uses: actions/cache@v3
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lambdas
      - name: Build
        env:
          BIN: ${{ matrix.binary }}
          VERSION: ${{ github.event.release.tag_name }}
        run: sh ./rust/scripts/build.sh

  build_extensions:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Zig toolchain
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.10.0
      - name: Install Cargo Lambda
        uses: jaxxstorm/action-install-gh-release@v1.9.0
        with:
          repo: cargo-lambda/cargo-lambda
          platform: linux
          arch: x86_64
      - uses: actions/checkout@master
      - name: Set up cargo cache
        uses: actions/cache@v3
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}-extension
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          cd rust
          cargo lambda build --release --extension --bin=extension
          cargo lambda deploy --extension --binary-name=extension extension-$VERSION

  build_images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        binary: ["syncer", "builder"]
    steps:
      - uses: actions/checkout@master

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          aws-region: eu-west-1

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ matrix.binary }}
          IMAGE_TAG: ${{ github.event.release.tag_name }}
          DOCKERFILE: ./docker/${{ matrix.binary }}/Dockerfile.${{ matrix.binary }}
        run: |
          DOCKER_BUILDKIT=1 
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG . -f $DOCKERFILE
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
