name: Build, Test, Deploy

on:
  release:
    types: [published]

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  build_lambdas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        binary: ["log-fetcher", "orchestrator"]
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Zig toolchain
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.10.0
      - name: Install Cargo Lambda
        uses: jaxxstorm/action-install-gh-release@v1.9.0
        with:
          repo: cargo-lambda/cargo-lambda
          platform: linux
          arch: x86_64
      - uses: actions/checkout@master
      - name: Set up cargo cache
        uses: actions/cache@v3
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lambdas
      - name: Build
        env:
          BIN: ${{ matrix.binary }}
          VERSION: ${{ github.event.release.tag_name }}
        run: sh ./rust/scripts/build.sh

  build_extensions:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Zig toolchain
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.10.0
      - name: Install Cargo Lambda
        uses: jaxxstorm/action-install-gh-release@v1.9.0
        with:
          repo: cargo-lambda/cargo-lambda
          platform: linux
          arch: x86_64
      - uses: actions/checkout@master
      - name: Set up cargo cache
        uses: actions/cache@v3
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}-extension
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          cargo lambda build --release --extension --bin=extension
          cargo lambda deploy --extension --binary-name=extension

  build_images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Build
        env:
          BIN: ${{ matrix.binary }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 730335604495.dkr.ecr.eu-west-1.amazonaws.com
          DOCKER_BUILDKIT=1 docker build -t 730335604495.dkr.ecr.eu-west-1.amazonaws.com/$BIN:$VERSION . -f ./docker/$BIN/Dockerfile.$BIN
