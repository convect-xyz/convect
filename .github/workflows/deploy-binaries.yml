name: "Build, Test"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Infra Version"
        required: true
        default: "warning"
        type: choice
        options:
          - infra-dev
          - infra-v1
  # push:
  #   paths:
  #     - "rust/**"
  #     - "packages/**"
  #     - "apps/bundler/**"
  #     - "infra/**"
  #   branches:
  #     - "infra/**"

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_lambdas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        binary: ["log-fetcher", "orchestrator"]
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Zig toolchain
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.10.0
      - name: Install Cargo Lambda
        uses: jaxxstorm/action-install-gh-release@v1.9.0
        with:
          repo: cargo-lambda/cargo-lambda
          platform: linux
          arch: x86_64
      - uses: actions/checkout@master
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.binary }}
          workspaces: "rust"
      - name: Build
        working-directory: rust
        env:
          BIN: ${{ matrix.binary }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          cargo lambda build --output-format zip --release -p $BIN
          aws s3api put-object --bucket ingest-functions --key $BIN/$GITHUB_SHA.zip --body "./target/lambda/$BIN/bootstrap.zip"

  build_reporting:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Zig toolchain
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.10.0
      - name: Install Cargo Lambda
        uses: jaxxstorm/action-install-gh-release@v1.9.0
        with:
          repo: cargo-lambda/cargo-lambda
          platform: linux
          arch: x86_64
      - uses: actions/checkout@master
      - name: Set up cargo cache
        uses: actions/cache@v3
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}-reporting
          restore-keys: ${{ runner.os }}-cargo
      - name: Build
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          cd rust
          cargo lambda build --output-format zip --release -p reporting
          aws s3api put-object --bucket ingest-functions --key reporting/$GITHUB_SHA.zip --body "./target/lambda/reporting/bootstrap.zip"

  build_extensions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        binary: ["extension", "handler-server"]
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Zig toolchain
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.10.0
      - name: Install Cargo Lambda
        uses: jaxxstorm/action-install-gh-release@v1.9.0
        with:
          repo: cargo-lambda/cargo-lambda
          platform: linux
          arch: x86_64
      - uses: actions/checkout@master
      - name: Set up cargo cache
        uses: actions/cache@v3
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}-${{ matrix.binary }}
          restore-keys: ${{ runner.os }}-cargo
      - name: Build
        env:
          TINYBIRD_API_KEY: ${{ secrets.TINYBIRD_API_KEY }}
          BIN: ${{ matrix.binary }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev postgresql
          cd rust
          cargo lambda build --extension --output-format zip --release -p $BIN
          aws s3api put-object --bucket ingest-functions --key $BIN/$GITHUB_SHA.zip --body "./target/lambda/extensions/$BIN.zip"

  build_images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        binary: ["builder", "syncer"]
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, tag, and push docker image to Amazon ECR
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: "${{ steps.login-ecr.outputs.registry }}/${{ matrix.binary }}:${{ github.sha }}"
          cache-from: type=gha,scope=${{ matrix.binary }}
          cache-to: type=gha,mode=max,scope=${{ matrix.binary }}
          file: ./docker/${{ matrix.binary }}/Dockerfile.${{ matrix.binary }}

  deploy_pulumi:
    needs: [build_lambdas, build_extensions, build_images]
    name: Deploy Pulumi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3.5.0
        with:
          node-version-file: package.json
      - name: Set up node cache
        uses: actions/cache@v3
        continue-on-error: false
        with:
          path: |
            node_modules
            infra/node_modules
          key: ${{ runner.os }}-deploy-pulumi-${{ hashFiles('infra/yarn.lock') }}-
          restore-keys: ${{ runner.os }}-deploy-pulumi-
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Set version
        env:
          VERSION: ${{ github.event.inputs.version || github.event.release.tag_name || github.ref_name }}
        run: |
          VERSION=${VERSION//\//-}
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Installing dependencies 📦️
        run: cd infra && yarn
      - uses: pulumi/actions@v3
        with:
          command: up
          work-dir: ./infra
          stack-name: ${{ env.VERSION }}
          upsert: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          TEST_STRIPE_API_KEY: ${{ secrets.TEST_STRIPE_API_KEY }}
          PROD_STRIPE_API_KEY: ${{ secrets.PROD_STRIPE_API_KEY }}
          TINYBIRD_API_KEY: ${{ secrets.TINYBIRD_API_KEY }}
          PROD_REPORTING_DB_URL: ${{ secrets.PROD_REPORTING_DB_URL }}
