name: "Deploy Stripe"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: "warning"
        type: choice
        options:
          - prod
          - test

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  CONFIG__REDIS__URL: ${{ secrets.CONFIG__REDIS__URL }}
  TINYBIRD_API_KEY: ${{ secrets.TINYBIRD_API_KEY }}
  INFRA_VERSION: ${{ github.event.inputs.version || github.event.release.tag_name || github.ref_name }}
  CONFIG_ENCRYPTION_PRIVATE_KEY: ${{ secrets.CONFIG_ENCRYPTION_PRIVATE_KEY }}
  CONFIG_ENCRYPTION_ALGORITHM: ${{ secrets.CONFIG_ENCRYPTION_ALGORITHM }}
  DATABASE_URL: ${{ secrets.PROD_REPORTING_DB_URL }}
  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
  TEST_STRIPE_API_KEY: ${{ secrets.TEST_STRIPE_API_KEY }}
  PROD_STRIPE_API_KEY: ${{ secrets.PROD_STRIPE_API_KEY }}
  PROD_REPORTING_DB_URL: ${{ secrets.PROD_REPORTING_DB_URL }}
  ENVIRONMENT: ${{ github.event.inputs.environment }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle_stripe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3.5.0
        with:
          node-version-file: package.json
      - name: Set up node cache
        uses: actions/cache@v3
        continue-on-error: false
        with:
          path: |
            node_modules
            apps/stripe/node_modules
          key: ${{ runner.os }}-deploy-config-${{ hashFiles('infra/yarn.lock') }}-
          restore-keys: ${{ runner.os }}-deploy-config-
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Installing dependencies 📦️
        run: cd infra && yarn
      - name: Bundle Stripe
        run: yarn esbuild ./apps/stripe/src/index.ts --bundle --platform=node --target=node10.4 --outfile=./infra/stripe/stripe.js
      - name: Upload Stripe Bundle to S3
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: aws s3api put-object --bucket ingest-functions --key stripe/$ENVIRONMENT.zip --body "./apps/stripe/dist/index.js"
      - uses: pulumi/actions@v3
        with:
          command: up
          work-dir: ./infra/stripe
          stack-name: stripe-${{ env.ENVIRONMENT }}
          upsert: true
