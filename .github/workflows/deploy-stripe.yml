name: "Deploy Stripe"

on:
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  DEV_APPLICATION_DB_URL: ${{ secrets.DEV_APPLICATION_DB_URL }}
  PROD_APPLICATION_DB_URL: ${{ secrets.PROD_APPLICATION_DB_URL }}
  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
  TEST_STRIPE_API_KEY: ${{ secrets.TEST_STRIPE_API_KEY }}
  PROD_STRIPE_API_KEY: ${{ secrets.PROD_STRIPE_API_KEY }}
  SENTRY_DSN: ${{ secrets.STRIPE_APP_SENTRY_DSN }}
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle_stripe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3.5.0
        with:
          node-version-file: package.json
      - name: Set up node cache
        uses: actions/cache@v3
        continue-on-error: false
        with:
          path: |
            node_modules
            infra/stripe/node_modules
          key: ${{ runner.os }}-deploy-config-${{ hashFiles('infra/stripe/package.json') }}-
          restore-keys: ${{ runner.os }}-deploy-config-
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Installing dependencies 📦️
        run: cd infra/stripe && yarn && cd ../../apps/stripe && yarn
      - name: Bundle Stripe
        run: cd infra/stripe && yarn esbuild ../../apps/stripe/src/index.ts --bundle --platform=node --target=node10.4 --loader:.node=copy --outfile=./stripe.js
      - uses: pulumi/actions@v6
        with:
          command: up
          work-dir: ./infra/stripe
          stack-name: stripe-${{ env.ENVIRONMENT }}
          upsert: true
