[package]
name = "ingest"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "log-fetcher"
path = "src/bin/log_fetcher.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ethers = { version = "2.0", features = ["ws"] }
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.22.0"
aws-sdk-ecs = "1.20.0"
aws-sdk-sqs = "1.14.0"
aws_lambda_events = { version = "0.15.0", default-features = false, features = [
  "sns",
] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0.114"
serde = { version = "1.0.136", features = ["derive"] }
aws-sdk-lambda = "1.19.0"
futures = "0.3.30"
web3 = "0.19.0"
lambda_runtime = "0.11.1"
openssl = { version = "0.10.35", features = ["vendored"] }
uuid = { version = "1.8.0", features = ["v4", "v7", "js"] }
aws-sdk-sns = "1.18.0"
reqwest = { version = "0.11", features = ["json", "blocking"] }
aws-smithy-types = "1.1.8"
lambda-extension = "0.10.0"
tracing-subscriber = "0.3.18"
regex = "1.10.4"
async-trait = "0.1.80"
redis = { version = "0.25.3", features = ["json", "cluster", "tls"] }
lambda_http = "0.11.1"
axum = "0.7.5"
hyper = { version = "0.14.27", features = ["full"] }
tower = "0.4.13"
diesel = { version = "2.1.0" }
diesel-async = { version = "0.3.1", features = ["postgres"] }

dotenvy = "0.15"

[dev-dependencies]
mockall = "0.12.1"
# [build-dependencies]
# prost-build = { version = "0.12.4" }
