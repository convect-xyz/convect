[package]
name = "log-fetcher"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }

aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.22.0"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0.114"
serde = { version = "1.0.136", features = ["derive"] }
lambda_runtime = "0.11.1"
