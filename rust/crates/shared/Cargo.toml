[package]
name = "shared"
version = "0.1.0"
edition = "2021"

[dependencies]
ethers = { version = "2.0", features = ["ws"] }
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.22.0"
aws-sdk-ecs = "1.20.0"
aws-sdk-sqs = "1.14.0"
aws_lambda_events = { version = "0.15.0", default-features = false, features = [
  "sns",
  "sqs",
] }
tokio = { version = "1", features = ["full"] }
tokio-retry = "0.3"
serde_json = "1.0.114"
serde = { version = "1.0.136", features = ["derive"] }
serde_with = "3.8.1"
aws-sdk-lambda = "1.19.0"
futures = "0.3.30"
web3 = "0.19.0"
openssl = { version = "0.10.35", features = ["vendored"] }
uuid = { version = "1.8.0", features = ["v4", "v7", "js"] }
aws-sdk-sns = "1.18.0"
reqwest = { version = "0.11", features = ["json", "blocking"] }
aws-smithy-types = "1.1.8"
tracing-subscriber = "0.3.18"
regex = "1.10.4"
async-trait = "0.1.80"
redis = { version = "0.25.3", features = [
  "json",
  "cluster",
  "tls",
  "aio",
  "tokio-comp",
  "tokio-native-tls-comp",
] }
lambda_runtime = "0.11.1"
diesel = { version = "2.1.0", features = ["chrono"], optional = true }
diesel-async = { version = "0.4.1", features = [
  "postgres",
  "deadpool",
], optional = true }
dotenvy = "0.15"
tokio-postgres = { version = "0.7.10", optional = true }
postgres = { version = "0.19.7", optional = true }
postgres-openssl = { version = "0.5.0", optional = true }
chrono = "0.4.38"
deadpool = { version = "0.12.1", features = ["managed"], optional = true }
backoff = { version = "0.4.0", features = ["futures", "tokio"] }
ethers-etherscan = "2.0.14"
once_cell = "1.19.0"
thiserror = "1.0.63"
rustc-hex = "2.1.0"
resend-rs = "0.9.1"
tracing = "0.1.40"
graphql_client = "0.14.0"
config = "0.15.4"
serde_yaml = "0.9.34"
itertools = "0.13.0"

[dev-dependencies]
mockall = "0.12.1"
# [build-dependencies]
# prost-build = { version = "0.12.4" }

[features]
pg = [
  "diesel",
  "diesel-async",
  "tokio-postgres",
  "postgres",
  "postgres-openssl",
  "deadpool",
]
telemetry = []
supported-networks = []
reporting-sdk = []
contract-info = []
events = []
