[package]
name = "producer"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared", features = ["supported-networks"] }

ethers = { version = "2.0", features = ["ws"] }
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-sns = "1.18.0"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0.114"
serde = { version = "1.0.136", features = ["derive"] }
serde_with = "3.8.1"
futures = "0.3.30"
tokio-retry = "0.3"
aws-smithy-runtime-api = "1.7.0"
tracing-subscriber = "0.3.18"
alloy = { version = "0.2.0", features = ["full"] }
async-trait = "0.1.80"
thiserror = "1.0.63"
chrono = "0.4.38"
resend-rs = "0.9.1"
backoff = { version = "0.4.0", features = ["futures", "tokio"] }
anyhow = "1.0.86"
