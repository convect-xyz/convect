[package]
name = "syncer"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared", features = ["pg"] }

aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.22.0"
aws-sdk-sqs = "1.14.0"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0.114"
serde = { version = "1.0.136", features = ["derive"] }
serde_with = "3.8.1"
aws-sdk-lambda = "1.19.0"
futures = "0.3.30"
web3 = "0.19.0"
lambda_runtime = "0.11.1"
openssl = { version = "0.10.35", features = ["vendored"] }
uuid = { version = "1.8.0", features = ["v4", "v7", "js"] }
aws-sdk-sns = "1.18.0"
aws-smithy-types = "1.1.8"
lambda-extension = "0.10.0"
tracing-subscriber = "0.3.18"
async-trait = "0.1.80"
lambda_http = "0.11.1"
tower = "0.4.13"
dotenvy = "0.15"
config = "0.15.4"
