[package]
name = "reporting"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared", features = ["pg", "reporting-sdk"] }

ethers = { version = "2.0", features = ["ws"] }
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.22.0"
aws-sdk-sqs = "1.14.0"
aws_lambda_events = { version = "0.15.0", default-features = false, features = [
  "sns",
  "sqs",
] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0.114"
serde = { version = "1.0.136", features = ["derive"] }
serde_with = "3.8.1"
aws-sdk-lambda = "1.19.0"
futures = "0.3.30"
web3 = "0.19.0"
lambda_runtime = "0.11.1"
openssl = { version = "0.10.35", features = ["vendored"] }
uuid = { version = "1.8.0", features = ["v4", "v7", "js"] }
aws-sdk-sns = "1.18.0"
reqwest = { version = "0.11", features = ["json", "blocking"] }
aws-smithy-types = "1.1.8"
lambda-extension = "0.10.0"
tracing-subscriber = "0.3.18"
regex = "1.10.4"
async-trait = "0.1.80"
redis = { version = "0.25.3", features = [
  "json",
  "cluster",
  "tls",
  "aio",
  "tokio-comp",
  "tokio-native-tls-comp",
] }
lambda_http = "0.11.1"
axum = { version = "0.7.5", features = ["macros"] }
hyper = { version = "0.14.27", features = ["full"] }
tower = "0.4.13"
diesel = { version = "2.1.0", features = ["chrono"] }
diesel-async = { version = "0.4.1", features = ["postgres", "deadpool"] }
dotenvy = "0.15"
tokio-postgres = "0.7.10"
postgres = "0.19.7"
postgres-openssl = "0.5.0"
chrono = "0.4.38"
deadpool = { version = "0.12.1", features = ["managed"] }
sentry = "0.34.0"
